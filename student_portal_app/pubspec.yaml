name: student_portal_app
description: "Student Portal Mobile Application for School Management System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_secure_storage: ^9.0.0
  http: ^1.2.1
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0
  table_calendar: ^3.0.9
  mobile_scanner: ^6.0.0
  flutter_spinkit: ^5.2.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  # sqflite_android 2.4.2+/2.4.3 reference Android API-36 ("Baklava") symbols
  # (Build.VERSION_CODES.BAKLAVA / Thread.threadId()), which fails javac
  # compilation when the project targets a lower SDK. Pin the newest release
  # that does NOT use those symbols (2.4.1 — verified against pub.dev source;
  # there is no 2.3.8, as the package only ships 2.4.x), so `flutter run`
  # builds cleanly. Combined with the forced compileSdk = 36 below.
  sqflite_android: 2.4.1

flutter:
  uses-material-design: true
