# JVM Heap Allocation & Performance Settings
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX Core Support
android.useAndroidX=true

# AGP 9.0+ & Kotlin Modern Compatibility
android.builtInKotlin=false
android.newDsl=false

# Speed & Build Performance Optimizations
org.gradle.parallel=true
org.gradle.caching=true
android.nonTransitiveRClass=true