{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied — School Management System</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="login-body">
    <div class="login-card center">
        <span class="login-logo" aria-hidden="true">🔒</span>
        <h1>403 — Access Denied</h1>
        <p>You do not have permission to view this page.</p>
        {% if user.is_authenticated %}
            <a class="btn btn-primary btn-block" href="{% url 'core:dashboard' %}">Back to Dashboard</a>
        {% else %}
            <a class="btn btn-primary btn-block" href="{% url 'accounts:login' %}">Sign In</a>
        {% endif %}
    </div>
</body>
</html>
